<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="焦虑 情绪胶囊">
  <defs>
    <linearGradient id="capsule-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 107, 107, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 107, 107, 0.03)"/>
    </linearGradient>
    <linearGradient id="capsule-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255, 107, 107, 1)"/>
      <stop offset="100%" stop-color="rgba(255, 107, 107, 0.55)"/>
    </linearGradient>
    <filter id="capsule-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF6B6B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 胶囊主体 -->
  <rect x="12" y="12" width="456" height="256" rx="120" fill="url(#capsule-bg)" stroke="#FF6B6B" stroke-width="2" filter="url(#capsule-shadow)"/>

  <!-- 顶部：心形图标 + 主色 15% 透明光晕 -->
  <circle cx="240" cy="72" r="36" fill="rgba(255, 107, 107, 0.15)"/>
  <g transform="translate(240,72) scale(1.25) translate(-12,-12)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF6B6B"/>
  </g>

  <!-- 中部核心：情绪类型名称 -->
  <text x="240" y="146" text-anchor="middle" font-size="30" font-weight="700" fill="#212529">焦虑</text>

  <!-- 进度条：灰色底轨 + 主色渐变填充 -->
  <rect x="90" y="168" width="300" height="12" rx="6" fill="#e9ecef"/>
  <rect x="90" y="168" width="216" height="12" rx="6" fill="url(#capsule-bar)"/>

  <!-- 底部：强度百分比数字 + 等级文字 -->
  <text x="240" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#FF6B6B">72%</text>
  <text x="240" y="242" text-anchor="middle" font-size="13" fill="#6c757d">情绪明显</text>
</svg>