app:
  description: 多轮情绪共情对话助手，带情绪胶囊记忆
  icon: 🧡
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: Mood Capsule
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables:
    - description: 最近一次对话的情绪胶囊（一句话凝练核心情绪）
      id: 2e1f0a1b-0000-4000-8000-000000000001
      name: emotion_capsule
      selector:
        - conversation
        - emotion_capsule
      value: ''
      value_type: string
    - description: 最近一次对话的情绪类型
      id: 2e1f0a1b-0000-4000-8000-000000000002
      name: last_emotion_type
      selector:
        - conversation
        - last_emotion_type
      value: ''
      value_type: string
    - description: 最近一次对话的情绪强度
      id: 2e1f0a1b-0000-4000-8000-000000000003
      name: last_emotion_intensity
      selector:
        - conversation
        - last_emotion_intensity
      value: ''
      value_type: string
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 你好呀，我是你的情绪树洞 Mood Capsule～想和我聊聊什么？
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-source-intent_llm-target
        source: start
        sourceHandle: source
        target: intent_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: if-else
        id: intent_llm-source-intent_branch-target
        source: intent_llm
        sourceHandle: source
        target: intent_branch
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: llm
        id: intent_branch-true-danger_llm-target
        source: intent_branch
        sourceHandle: 'true'
        target: danger_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: llm
        id: intent_branch-elif-summary_llm-target
        source: intent_branch
        sourceHandle: 2e1f0a1b-0000-4000-8000-000000000012
        target: summary_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: llm
        id: intent_branch-false-empathy_llm-target
        source: intent_branch
        sourceHandle: 'false'
        target: empathy_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: danger_llm-source-danger_clean-target
        source: danger_llm
        sourceHandle: source
        target: danger_clean
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: answer
        id: danger_clean-source-answer_danger-target
        source: danger_clean
        sourceHandle: source
        target: answer_danger
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: empathy_llm-source-capsule_code-target
        source: empathy_llm
        sourceHandle: source
        target: capsule_code
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: assigner
        id: capsule_code-source-capsule_assigner-target
        source: capsule_code
        sourceHandle: source
        target: capsule_assigner
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: assigner
          targetType: answer
        id: capsule_assigner-source-answer_chat-target
        source: capsule_assigner
        sourceHandle: source
        target: answer_chat
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: summary_llm-source-summary_code-target
        source: summary_llm
        sourceHandle: source
        target: summary_code
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: assigner
        id: summary_code-source-summary_assigner-target
        source: summary_code
        sourceHandle: source
        target: summary_assigner
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: assigner
          targetType: answer
        id: summary_assigner-source-answer_summary-target
        source: summary_assigner
        sourceHandle: source
        target: answer_summary
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 开始
          type: start
          variables: []
        height: 54
        id: start
        position:
          x: 40
          y: 400
        positionAbsolute:
          x: 40
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          model:
            completion_params:
              temperature: 0.1
            mode: chat
            name: deepseek-v4-flash
            provider: deepseek
          prompt_template:
            - role: system
              text: |
                你是情绪共情助手（Mood Capsule）的意图识别模块。根据用户当前输入判断意图，只能输出以下三个词之一：danger、end_chat、chat。

                判断规则：
                1. danger：用户表达强烈的自杀、自残、伤害自己或他人的危险信号，或明确处于严重危机中。
                2. end_chat：用户明确表达想结束对话、告别、说再见、停止聊天等结束意图。
                3. chat：其他一切正常的情绪倾诉、闲聊、日常交流。

                严格要求：只能输出一个词（danger / end_chat / chat），不要输出任何解释、标点、引号或多余内容。
            - role: user
              text: '{{#sys.query#}}'
          selected: false
          title: 意图识别
          type: llm
          vision:
            enabled: false
        height: 98
        id: intent_llm
        position:
          x: 340
          y: 400
        positionAbsolute:
          x: 340
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: contains
                  id: 2e1f0a1b-0000-4000-8000-000000000011
                  value: danger
                  varType: string
                  variable_selector:
                    - intent_llm
                    - text
              logical_operator: and
            - case_id: 2e1f0a1b-0000-4000-8000-000000000012
              conditions:
                - comparison_operator: contains
                  id: 2e1f0a1b-0000-4000-8000-000000000013
                  value: end_chat
                  varType: string
                  variable_selector:
                    - intent_llm
                    - text
              logical_operator: and
          desc: ''
          isInIteration: false
          isInLoop: false
          selected: false
          title: 意图分支
          type: if-else
        height: 126
        id: intent_branch
        position:
          x: 640
          y: 400
        positionAbsolute:
          x: 640
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: deepseek-v4-pro
            provider: deepseek
          prompt_template:
            - role: system
              text: |
                你是情绪共情助手（Mood Capsule）的危机干预模块。用户当前可能处于心理危机状态（如自伤、自杀、伤人风险）。请务必：
                1. 表达深切的关心和陪伴，让用户感到被看见、被重视、不孤单。
                2. 温和而坚定地鼓励用户立即向信任的人或专业机构求助。
                3. 提供可用的求助渠道（如全国心理援助热线等）。

                语气要求：温暖、平静、不评判，绝对不要敷衍、说教或讲大道理。优先安抚情绪，再给建议。
            - role: user
              text: '{{#sys.query#}}'
          selected: false
          title: 危险干预
          type: llm
          vision:
            enabled: false
        height: 98
        id: danger_llm
        position:
          x: 940
          y: 180
        positionAbsolute:
          x: 940
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import re

            def main(danger_text: str) -> dict:
                raw = (danger_text or '').strip()
                # 去除 deepseek 推理内容（<!--dify-deepseek-reasoning--> 注释与 <think>...</think>）
                cleaned = re.sub(r'<!--.*?-->', '', raw, flags=re.DOTALL)
                cleaned = re.sub(r'<think>.*?</think>', '', cleaned, flags=re.DOTALL)
                cleaned = cleaned.strip()
                return {'text': cleaned}
          code_language: python3
          desc: ''
          outputs:
            text:
              children: null
              type: string
          selected: false
          title: 危险回复清洗
          type: code
          variables:
            - value_selector:
                - danger_llm
                - text
              variable: danger_text
        height: 98
        id: danger_clean
        position:
          x: 1240
          y: 180
        positionAbsolute:
          x: 1240
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#danger_clean.text#}}'
          desc: ''
          selected: false
          title: 直接回复
          type: answer
          variables: []
        height: 90
        id: answer_danger
        position:
          x: 1540
          y: 180
        positionAbsolute:
          x: 1540
          y: 180
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory:
            query_prompt_template: '{{#sys.query#}}'
            window:
              enabled: true
              size: 20
          model:
            completion_params:
              temperature: 0.2
            mode: chat
            name: deepseek-v4-flash
            provider: deepseek
          prompt_template:
            - role: system
              text: |
                你是情绪共情助手（Mood Capsule）的情绪总结模块。请根据本次对话内容，总结核心情绪并生成温暖的道别语。

                必须严格输出 JSON，不要输出任何其他内容，格式如下：
                {"emotion_type": "情绪类型", "intensity": "情绪强度(0-10)", "farewell": "温暖的道别语"}

                要求：
                1. emotion_type：本次对话的核心情绪，例如：开心、悲伤、焦虑、愤怒、平静、孤独、疲惫等。
                2. intensity：情绪强度，0 到 10 的整数。
                3. farewell：一句温暖、真诚的道别语，让用户感到被理解和支持。
            - role: user
              text: '{{#sys.query#}}'
          selected: false
          title: 情绪总结
          type: llm
          vision:
            enabled: false
        height: 98
        id: summary_llm
        position:
          x: 940
          y: 400
        positionAbsolute:
          x: 940
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import json
            import re

            def _extract_json(text: str):
                s = text or ''
                s = re.sub(r'<!--.*?-->', '', s, flags=re.DOTALL)
                s = re.sub(r'<think>.*?</think>', '', s, flags=re.DOTALL)
                s = re.sub(r'```[a-zA-Z]*', '', s)
                s = s.replace('```', '')
                s = s.strip()
                try:
                    return json.loads(s)
                except Exception:
                    pass
                decoder = json.JSONDecoder()
                idx = 0
                while True:
                    start = s.find('{', idx)
                    if start == -1:
                        break
                    try:
                        obj, _ = decoder.raw_decode(s[start:])
                        return obj
                    except Exception:
                        idx = start + 1
                raise ValueError('no JSON object found')

            def main(summary_json: str) -> dict:
                farewell = '感谢你的陪伴，下次想聊随时找我呀'
                emotion_type = '平静'
                intensity = '0'
                try:
                    data = _extract_json(summary_json)
                    if isinstance(data, dict):
                        farewell = str(data.get('farewell') or '').strip() or farewell
                        emotion_type = str(data.get('emotion_type') or '').strip() or emotion_type
                        intensity = str(data.get('intensity') or '').strip() or intensity
                except Exception:
                    pass
                return {'farewell': farewell, 'emotion_type': emotion_type, 'intensity': intensity}
          code_language: python3
          desc: ''
          outputs:
            farewell:
              children: null
              type: string
            emotion_type:
              children: null
              type: string
            intensity:
              children: null
              type: string
          selected: false
          title: 情绪总结解析
          type: code
          variables:
            - value_selector:
                - summary_llm
                - text
              variable: summary_json
        height: 98
        id: summary_code
        position:
          x: 1240
          y: 400
        positionAbsolute:
          x: 1240
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          items:
            - input_type: variable
              operation: over-write
              value:
                - summary_code
                - emotion_type
              variable_selector:
                - conversation
                - last_emotion_type
            - input_type: variable
              operation: over-write
              value:
                - summary_code
                - intensity
              variable_selector:
                - conversation
                - last_emotion_intensity
          selected: false
          title: 写入总结变量
          type: assigner
          version: '2'
        height: 126
        id: summary_assigner
        position:
          x: 1540
          y: 400
        positionAbsolute:
          x: 1540
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#summary_code.farewell#}}'
          desc: ''
          selected: false
          title: 直接回复
          type: answer
          variables: []
        height: 90
        id: answer_summary
        position:
          x: 1840
          y: 400
        positionAbsolute:
          x: 1840
          y: 400
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: ''
          memory:
            query_prompt_template: '{{#sys.query#}}'
            window:
              enabled: true
              size: 10
          model:
            completion_params:
              temperature: 0.7
            mode: chat
            name: deepseek-v4-pro
            provider: deepseek
          prompt_template:
            - role: system
              text: |
                你是情绪共情助手（Mood Capsule），一个温暖、善解人意的倾听者。请做到：
                1. 认真倾听并共情用户当下的情绪，先接纳和回应情绪，再适度回应内容。
                2. 语言自然、真诚、有温度，避免说教、套话和过度提问。
                3. 鼓励用户继续表达，让用户感到安全和被理解。
                4. 如果「历史情绪胶囊」非空，请自然地承接用户之前的情绪状态（例如“上次你提到……”）。

                历史情绪胶囊：{{#conversation.emotion_capsule#}}

                回复末尾必须附加一段「情绪胶囊」，格式严格如下（用【】包裹）：
                【情绪胶囊：用一句话凝练本次对话中用户的核心情绪与状态】
            - role: user
              text: '{{#sys.query#}}'
          selected: false
          title: 共情对话
          type: llm
          vision:
            enabled: false
        height: 98
        id: empathy_llm
        position:
          x: 940
          y: 620
        positionAbsolute:
          x: 940
          y: 620
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import re

            def main(empathy_text: str) -> dict:
                raw = (empathy_text or '').strip()
                # 去除 deepseek 推理内容（<!--dify-deepseek-reasoning--> 注释与 <think>...</think>）
                cleaned = re.sub(r'<!--.*?-->', '', raw, flags=re.DOTALL)
                cleaned = re.sub(r'<think>.*?</think>', '', cleaned, flags=re.DOTALL)
                cleaned = cleaned.strip()
                # 提取情绪胶囊用于存储，并保留在回复文本中（用户可见）
                capsule = ''
                m = re.search(r'【情绪胶囊[:：]\s*([^】]+)】', cleaned)
                if m:
                    capsule = m.group(1).strip()
                return {'capsule': capsule, 'text': cleaned}
          code_language: python3
          desc: ''
          outputs:
            capsule:
              children: null
              type: string
            text:
              children: null
              type: string
          selected: false
          title: 情绪胶囊存储
          type: code
          variables:
            - value_selector:
                - empathy_llm
                - text
              variable: empathy_text
        height: 98
        id: capsule_code
        position:
          x: 1240
          y: 620
        positionAbsolute:
          x: 1240
          y: 620
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          items:
            - input_type: variable
              operation: over-write
              value:
                - capsule_code
                - capsule
              variable_selector:
                - conversation
                - emotion_capsule
          selected: false
          title: 写入情绪胶囊
          type: assigner
          version: '2'
        height: 126
        id: capsule_assigner
        position:
          x: 1540
          y: 620
        positionAbsolute:
          x: 1540
          y: 620
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: '{{#capsule_code.text#}}'
          desc: ''
          selected: false
          title: 直接回复
          type: answer
          variables: []
        height: 90
        id: answer_chat
        position:
          x: 1840
          y: 620
        positionAbsolute:
          x: 1840
          y: 620
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1



